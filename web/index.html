<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIP4D-ZIP ビューア - 防災画像地図</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Leaflet.js (Google Maps の代替) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <style>
        .map { background: #ddd; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🗺️ SIP4D-ZIP ビューア</h1>
            <p>防災画像データの地理的可視化</p>
            <p style="font-size: 11px; opacity: 0.7; margin-top: 10px;">Version: 1df4953</p>
        </header>

        <div class="content">
            <aside class="sidebar">
                <div class="panel">
                    <h2>📁 データ管理</h2>
                    <div class="data-upload">
                        <input type="file" id="zipUpload" accept=".zip" style="display:none;">
                        <button id="uploadBtn" class="btn">ZIP ファイルをアップロード</button>
                    </div>
                    <div id="dataInfo" class="data-info"></div>
                </div>

                <div class="panel">
                    <div id="featureImageContainer" class="feature-image-container" style="display:none;">
                        <img id="featureImage" src="" alt="Feature Image" class="feature-image">
                    </div>
                    <h2>🔍 詳細情報</h2>
                    <div id="featureInfo" class="feature-info">
                        <p style="color: #999;">Pin をクリックして詳細を表示</p>
                    </div>
                </div>
            </aside>

            <main class="map-container">
                <div id="map" class="map"></div>
                <div id="imagePreview" class="image-preview" style="display:none;">
                    <img id="previewImage" src="" alt="Preview">
                    <button id="closePreview" class="close-btn">✕</button>
                </div>
            </main>
        </div>
    </div>

    <!-- Required Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

    <!-- Application Scripts -->
    <script src="js/data-loader.js"></script>
    <script src="js/map-leaflet.js"></script>
    <script src="js/main.js"></script>

    <!-- Optional: Google Maps (uncomment if API key is available) -->
    <!-- <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY"></script> -->
</body>
</html>
